name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # 5.2.0
        with:
          dotnet-version: '10.0.x'
      - uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # 4.0.0
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # 3.0.0
        with:
          msbuild-architecture: x64

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
        id: changes
        with:
          filters: |
            buildprops:
              - 'Directory.Build.props'

      - name: Update version
        if: steps.changes.outputs.buildprops == 'false'
        run: |
          (Get-Content Directory.Build.props) | % { 
              $m = [regex]::match($_, '<Version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?</Version>');
              if(!$m.Success -or $m.Groups[4].Success -or $m.Groups[5].Success) { $_; }
              else { $_ -replace $m.Value, ("<Version>{0}.{1}.{2}-pre${{ github.run_number }}</Version>" -f $m.Groups[1].Value,$m.Groups[2].Value,([convert]::ToInt32($m.Groups[3].Value)+1)); }
          } | Set-Content Directory.Build.props

      - name: Restore application packages
        run: dotnet restore LibreHardwareMonitor.Windows.Forms\LibreHardwareMonitor.Windows.Forms.csproj 

      - name: Build application
        run: dotnet build LibreHardwareMonitor.Windows.Forms\LibreHardwareMonitor.Windows.Forms.csproj -c Release --no-restore -p:Platform=x64

      - name: Run tests
        run: dotnet test GoGoGadgetHardwareMonitor.Tests\GoGoGadgetHardwareMonitor.Tests.csproj -c Release

      # Fork change: only the net10.0-windows app build is published as a
      # downloadable artifact - this fork only ever installs/runs that
      # one (see CLAUDE.md's "Build & verify"), and it's what's actually
      # gotten installed from CI in practice. The "Build application"
      # step above still builds net472 too (the multi-targeted csproj
      # builds every target when no -f is given) - needed for the
      # net472/net10.0-windows compatibility gate CLAUDE.md calls out, a
      # target-specific bug like a missing Math.Clamp overload wouldn't
      # show up if only one target ever compiled - just not uploaded,
      # since nobody's installed a net472 build from CI. retention-days
      # bounds each artifact instead of the default 90 days (dropped
      # LibreHardwareMonitorLib's separate x64/x86/ARM64 builds and the
      # nupkg pack below - upstream ships those to NuGet, but this fork's
      # own "Publish to NuGet" step was already gated to the upstream
      # repo and never ran here, so building and uploading them was pure
      # overhead for a fork that only ships the app itself, not the
      # library standalone).
      #
      # OutputPath now includes $(Platform) (LibreHardwareMonitor.Windows.Forms.csproj)
      # - without it, this x64 build and the ARM64 one below would land
      # in the same folder and silently overwrite each other.
      - name: Publish net10.0 application (x64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: GoGoGadgetHardwareMonitor (.NET 10, x64)
          path: |
            bin/Release/x64/net10.0-windows
          retention-days: 30

      # Fork addition: native ARM64 build, for Windows-on-ARM devices
      # (Surface Pro X/11, Copilot+ PCs). Built for net10.0-windows only
      # - .NET Framework 4.7.2 has no real native ARM64 runtime, so
      # net472 stays x64-only (it already runs fine under Windows'
      # x64 emulation on ARM64 anyway). A hardware monitor specifically
      # benefits from a true native build here, unlike most apps: PawnIO
      # (the kernel driver this app uses for sensor access) needs to
      # match the actual CPU architecture - x64-emulated code can't
      # necessarily read ARM64 hardware sensors correctly.
      - name: Build application (ARM64)
        run: dotnet build LibreHardwareMonitor.Windows.Forms\LibreHardwareMonitor.Windows.Forms.csproj -c Release --no-restore -p:Platform=ARM64 -f net10.0-windows

      - name: Publish net10.0 application (ARM64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: GoGoGadgetHardwareMonitor (.NET 10, ARM64)
          path: |
            bin/Release/ARM64/net10.0-windows
          retention-days: 30
